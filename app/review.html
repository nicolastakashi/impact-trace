<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · impact-trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Same tokens as the prototype (index.html): one queue on the left, one decision card on the right. */
:root{
  color-scheme: light;
  --ground:#f3f3f1; --s1:#ffffff; --s2:#f7f7f5; --s3:#ebebe7; --line:#deded9; --line-2:#c9c9c2;
  --ink:#121214; --ink-2:#4f4f55; --ink-3:#86868c;
  --accent:#d93a3f; --accent-ink:#ffffff;
  --m-clarify:#a68300; --m-prevent:#c8326a; --m-solve:#d0571f; --m-build:#12854a; --m-elevate:#5b47d6; --m-external:#5f6470;
  --shadow:0 1px 2px rgba(20,20,30,.06), 0 8px 24px -12px rgba(20,20,30,.18);
  --key-bg:#ffffff; --key-edge:#cfcfc8;
  --f-num:"Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
  --f-body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#070709; --s1:#0f0f13; --s2:#15151b; --s3:#1d1d25; --line:#24242d; --line-2:#34343f;
  --ink:#f4f4f1; --ink-2:#b4b4b8; --ink-3:#74747c;
  --accent:#ff4d52; --accent-ink:#0b0b0b;
  --m-clarify:#ffe37a; --m-prevent:#ff4f8f; --m-solve:#ff7a45; --m-build:#7dffa8; --m-elevate:#b3a1ff; --m-external:#9aa3b5;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -24px rgba(0,0,0,.8);
  --key-bg:#1b1b22; --key-edge:#0a0a0d;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#070709; --s1:#0f0f13; --s2:#15151b; --s3:#1d1d25; --line:#24242d; --line-2:#34343f;
  --ink:#f4f4f1; --ink-2:#b4b4b8; --ink-3:#74747c;
  --accent:#ff4d52; --accent-ink:#0b0b0b;
  --m-clarify:#ffe37a; --m-prevent:#ff4f8f; --m-solve:#ff7a45; --m-build:#7dffa8; --m-elevate:#b3a1ff; --m-external:#9aa3b5;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -24px rgba(0,0,0,.8);
  --key-bg:#1b1b22; --key-edge:#0a0a0d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);padding:24px clamp(16px,3vw,40px) 48px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;font:500 11px var(--f-mono);color:var(--ink-2);background:var(--key-bg);border:1px solid var(--line-2);border-bottom:3px solid var(--key-edge);border-radius:6px}
.lbl{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}

header{display:flex;flex-wrap:wrap;align-items:end;gap:12px 28px;margin-bottom:20px}
header h1{font:700 40px/1 var(--f-num);letter-spacing:.01em;margin:0;text-transform:uppercase}
header .stat{display:grid;gap:2px}
header .stat b{font:600 28px/1 var(--f-num);font-variant-numeric:tabular-nums}
header select{font:500 13px var(--f-mono);background:var(--s1);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px}
header .back{margin-left:auto;font:500 12px var(--f-mono);color:var(--ink-2)}

.wrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.queue{max-height:220px}}

.queue{list-style:none;margin:0;padding:6px;background:var(--s1);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:16px}
.queue button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.queue button:hover{background:var(--s2)}
.queue button[aria-current="true"]{background:var(--s3);color:var(--ink)}
.queue .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue .n{font:500 11px var(--f-mono);color:var(--ink-3)}
.queue .done{color:var(--m-build)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(18px,3vw,32px);display:grid;gap:22px;min-width:0}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--s3)}
.prog i.d{background:var(--m-build)}
.prog i.c{background:var(--accent)}
.title{width:100%;font:700 30px/1.15 var(--f-num);letter-spacing:.01em;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line-2);padding:2px 0 6px}
.title:focus{outline:0;border-bottom-color:var(--accent)}
.summary{width:100%;max-width:72ch;font:400 16px/1.55 var(--f-body);color:var(--ink-2);background:transparent;border:0;border-radius:8px;padding:6px 8px;margin:-6px -8px 0;resize:none;field-sizing:content;min-height:2lh}
.summary:hover{background:var(--s2)}
.summary:focus{outline:0;background:var(--s2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.sec{display:grid;gap:10px}

.events{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto}
.events li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px}
.events li:first-child{border-top:0}
.events li.ev{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.events .k{font:500 11px var(--f-mono);color:var(--ink-3);padding-top:2px}
.events .x{min-width:0;overflow-wrap:anywhere}
.events .x small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
@media (max-width:520px){.events li{grid-template-columns:1fr;gap:2px}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 10px 7px 7px;background:var(--s2);border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--s1);border-color:var(--c,var(--ink));box-shadow:0 0 0 1px var(--c,var(--ink)), 0 0 14px -6px var(--c,var(--ink))}
.chip .ai{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:620px){.two{grid-template-columns:1fr}}

.wm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.wm{grid-template-columns:1fr}}
.wm button{display:flex;align-items:center;gap:10px;padding:12px;background:var(--s2);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left}
.wm button:hover{border-color:var(--ink-2)}
.wm button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.wm button[aria-pressed="true"] kbd{color:var(--ink);}
.discard{justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:7px 10px 7px 7px;background:none;border:1px dashed var(--line-2);border-radius:10px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.discard:hover{color:var(--ink);border-color:var(--ink-2)}
.discard[aria-pressed="true"]{border-style:solid;border-color:var(--ink-2);color:var(--ink);background:var(--s3)}
.queue .gone .t{text-decoration:line-through;color:var(--ink-3)}
.prog i.x{background:var(--line-2)}

.keys{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}
.keys span{display:inline-flex;align-items:center;gap:4px}
.empty{padding:40px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:10px;font:500 13px var(--f-mono)}
@media (prefers-reduced-motion: no-preference){ .card{transition:opacity .15s} .card.swap{opacity:.4} }
</style>
</head>
<body>
<header>
  <h1>Review</h1>
  <label class="stat"><span class="lbl">Week</span><select id="week" aria-label="Week"></select></label>
  <div class="stat"><span class="lbl">Decided</span><b id="done">–</b></div>
  <div class="stat"><span class="lbl">Claude matches you · mode</span><b id="agree">–</b></div>
  <a class="back" href="/">← impact</a>
</header>
<div class="wrap">
  <ul class="queue" id="queue" aria-label="Threads of the week"></ul>
  <main class="card" id="card"><div class="empty">Loading threads…</div></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const MODES = {clarify:"clarify", prevent:"prevent", solve:"solve", build:"build", elevate:"elevate", external:"external"};
const MODE_KEYS = ["a","s","d","f","g","h"];
const PILLAR = {big:"big-picture", exec:"execution", level:"leveling-up"};
const PILLAR_KEYS = ["z","x","c"];
const WM = [["wouldnt","wouldn't happen"],["slower","slower"],["same","same"]];
const KIND = {pr_merged:"PR merged", pr_open:"PR open", issue_completed:"issue done", issue_open:"issue open",
  review_comment:"review received", reviews_given:"reviews given", slack_message:"Slack", slack_mention:"mention",
  meeting:"meeting", doc_created:"doc created", doc_edited:"doc edited"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mc = m => `var(--m-${m})`;

let data = {threads:[]}, cur = 0, draft = {};

async function load(week){
  const r = await fetch("/api/review" + (week ? `?week=${week}` : ""));
  data = await r.json();
  $("#week").innerHTML = data.weeks.map(w => `<option ${w===data.week?"selected":""}>${w}</option>`).join("");
  cur = Math.max(0, data.threads.findIndex(t => !t.human.without_me));
  render();
}

// What the card shows: your decision if any, else Claude's suggestion.
function pick(t){
  const d = draft[t.key] ??= {title: t.human.title ?? t.claude.title ?? "", summary: t.human.summary ?? t.claude.summary ?? "", mode: t.human.mode ?? t.claude.mode, pillar: t.human.pillar ?? t.claude.pillar};
  return d;
}

function stats(){
  const decided = data.threads.filter(t => t.human.without_me);
  // A discarded thread has no mode to agree on.
  const both = decided.filter(t => t.claude.mode && t.human.without_me !== "discard");
  $("#done").textContent = `${decided.length}/${data.threads.length}`;
  $("#agree").textContent = both.length ? `${both.filter(t => t.claude.mode === t.human.mode).length}/${both.length}` : "–";
}

function render(){
  stats();
  const ts = data.threads;
  $("#queue").innerHTML = ts.map((t,i) => { const d = pick(t); return `<li><button data-i="${i}" aria-current="${i===cur}" class="${t.human.without_me==="discard"?"gone":""}">
    <i class="dot" style="background:${mc(d.mode)}"></i><span class="t">${esc(d.title)}</span>
    <span class="n ${t.human.without_me?"done":""}">${t.human.without_me==="discard"?"✕":t.human.without_me?"✓":t.events.length}</span></button></li>`; }).join("");
  if(!ts.length){ $("#card").innerHTML = `<div class="empty">No suggested threads yet. Run <code>./run.sh</code> to collect the week and suggest labels.</div>`; return; }
  const t = ts[cur], d = pick(t), ev = new Set(JSON.parse(t.claude.evidence ?? "[]"));
  const kinds = Object.entries(t.events.reduce((a,e) => (a[e.kind]=(a[e.kind]||0)+1, a), {})).map(([k,n]) => `${n} ${KIND[k]??k}`).join(" · ");
  $("#card").innerHTML = `
    <div class="prog" aria-hidden="true">${ts.map((x,i) => `<i class="${x.human.without_me==="discard"?"x":x.human.without_me?"d":i===cur?"c":""}"></i>`).join("")}</div>
    <div class="sec"><span class="lbl">${esc(data.week)}${t.projects?.length?` · ${t.projects.map(esc).join(", ")}`:""} · ${kinds}</span>
      <input class="title" id="title" value="${esc(d.title)}" aria-label="Thread title">
      <textarea class="summary" id="summary" rows="2" aria-label="Summary of what you did" placeholder="No summary yet">${esc(d.summary)}</textarea></div>
    <div class="sec"><span class="lbl">Evidence</span><ul class="events">${t.events.map(e => `<li class="${ev.has(e.id)?"ev":""}">
      <span class="k">${KIND[e.kind]??e.kind}</span>
      <span class="x">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title ?? e.id)} ↗</a>`:esc(e.title ?? e.id)}
      ${e.author && e.kind!=="pr_merged" && e.kind!=="pr_open" ? ` <span class="lbl">${esc(e.author)}</span>`:""}
      ${e.text?`<small>${esc(e.text)}</small>`:""}</span></li>`).join("")}</ul></div>
    <div class="two">
      <div class="sec"><span class="lbl">Mode</span><div class="chips">${Object.keys(MODES).map((k,i) => chip("mode", k, MODES[k], MODE_KEYS[i], d, t, mc(k))).join("")}</div></div>
      <div class="sec"><span class="lbl">Pillar · Reilly</span><div class="chips">${Object.keys(PILLAR).map((k,i) => chip("pillar", k, PILLAR[k], PILLAR_KEYS[i], d, t)).join("")}</div></div>
    </div>
    <div class="sec"><span class="lbl">Without you, would it have happened? · saves and moves on</span>
      <div class="wm">${WM.map(([k,l],i) => `<button data-wm="${k}" aria-pressed="${t.human.without_me===k}"><kbd>${i+1}</kbd>${l}</button>`).join("")}</div>
      <button class="discard" data-wm="discard" aria-pressed="${t.human.without_me==="discard"}"><kbd>0</kbd>Discard · not impact</button></div>
    <div class="keys"><span><kbd>A</kbd>–<kbd>H</kbd> mode</span><span><kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> pillar</span>
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> without you, save</span><span><kbd>0</kbd> discard</span><span><kbd>J</kbd><kbd>K</kbd> move</span>
      <span><kbd>T</kbd> edit title</span><span><kbd>E</kbd> edit summary</span><span><kbd>O</kbd> open evidence</span></div>`;
  $("#queue [aria-current=true]")?.scrollIntoView({block:"nearest"});
}

function chip(field, k, label, key, d, t, color){
  const ai = t.claude[field] === k ? `<span class="ai" title="Claude's suggestion">Claude</span>` : "";
  return `<button class="chip" data-${field}="${k}" aria-pressed="${d[field]===k}" style="${color?`--c:${color}`:""}">
    <kbd>${key.toUpperCase()}</kbd>${color?`<i class="dot" style="background:${color}"></i>`:""}${label}${ai}</button>`;
}

function set(field, v){ pick(data.threads[cur])[field] = v; render(); }
function go(i){ cur = Math.min(Math.max(i,0), data.threads.length-1); render(); }
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }

async function save(wm){
  const t = data.threads[cur], d = pick(t);
  d.title = $("#title").value.trim() || d.title;
  d.summary = $("#summary").value.trim();
  const labels = wm === "discard" ? {without_me: wm} : {title: d.title, mode: d.mode, pillar: d.pillar, without_me: wm, ...(d.summary && {summary: d.summary})};
  const r = await fetch("/api/labels", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({week: data.week, key: t.key, labels})});
  if(!r.ok){ toast(`Not saved: ${await r.text()}`); return; }
  Object.assign(t.human, labels);
  toast(wm === "discard" ? "Discarded" : "Saved");
  const next = data.threads.findIndex((x,i) => i > cur && !x.human.without_me);
  go(next >= 0 ? next : cur);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.i) go(+b.dataset.i);
  else if(b.dataset.mode) set("mode", b.dataset.mode);
  else if(b.dataset.pillar) set("pillar", b.dataset.pillar);
  else if(b.dataset.wm) save(b.dataset.wm);
});
document.addEventListener("input", e => { if(e.target.id === "title" || e.target.id === "summary") pick(data.threads[cur])[e.target.id] = e.target.value; });
document.addEventListener("keydown", e => {
  if(e.target.id === "title" || e.target.id === "summary"){ if(e.key === "Escape" || (e.key === "Enter" && !e.shiftKey)){ e.preventDefault(); e.target.blur(); } return; }
  if(e.metaKey || e.ctrlKey || e.altKey || !data.threads.length) return;
  const k = e.key.toLowerCase();
  if(MODE_KEYS.includes(k)) set("mode", Object.keys(MODES)[MODE_KEYS.indexOf(k)]);
  else if(PILLAR_KEYS.includes(k)) set("pillar", Object.keys(PILLAR)[PILLAR_KEYS.indexOf(k)]);
  else if(["1","2","3"].includes(k)) save(WM[+k-1][0]);
  else if(k === "0") save("discard");
  else if(k === "j") go(cur+1);
  else if(k === "k") go(cur-1);
  else if(k === "t"){ e.preventDefault(); $("#title").focus(); $("#title").select(); }
  else if(k === "e"){ e.preventDefault(); const s = $("#summary"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  else if(k === "o"){ const a = $(".events li.ev a") ?? $(".events a"); if(a) window.open(a.href, "_blank", "noopener"); }
  else return;
  e.preventDefault();
});
$("#week").addEventListener("change", e => { draft = {}; load(e.target.value); });
load(new URLSearchParams(location.search).get("week"));
</script>
</body>
</html>
