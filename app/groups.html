<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groups · impact-trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Same tokens as review.html. One section per group; a week strip, then its threads week by week. */
:root{
  color-scheme: light;
  --ground:#f3f3f1; --s1:#ffffff; --s2:#f7f7f5; --s3:#ebebe7; --line:#deded9; --line-2:#c9c9c2;
  --ink:#121214; --ink-2:#4f4f55; --ink-3:#86868c;
  --accent:#d93a3f; --accent-ink:#ffffff;
  --m-clarify:#a68300; --m-prevent:#c8326a; --m-solve:#d0571f; --m-build:#12854a; --m-elevate:#5b47d6; --m-external:#5f6470;
  --shadow:0 1px 2px rgba(20,20,30,.06), 0 8px 24px -12px rgba(20,20,30,.18);
  --key-bg:#ffffff; --key-edge:#cfcfc8;
  --f-num:"Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
  --f-body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#070709; --s1:#0f0f13; --s2:#15151b; --s3:#1d1d25; --line:#24242d; --line-2:#34343f;
  --ink:#f4f4f1; --ink-2:#b4b4b8; --ink-3:#74747c;
  --accent:#ff4d52; --accent-ink:#0b0b0b;
  --m-clarify:#ffe37a; --m-prevent:#ff4f8f; --m-solve:#ff7a45; --m-build:#7dffa8; --m-elevate:#b3a1ff; --m-external:#9aa3b5;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -24px rgba(0,0,0,.8);
  --key-bg:#1b1b22; --key-edge:#0a0a0d;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#070709; --s1:#0f0f13; --s2:#15151b; --s3:#1d1d25; --line:#24242d; --line-2:#34343f;
  --ink:#f4f4f1; --ink-2:#b4b4b8; --ink-3:#74747c;
  --accent:#ff4d52; --accent-ink:#0b0b0b;
  --m-clarify:#ffe37a; --m-prevent:#ff4f8f; --m-solve:#ff7a45; --m-build:#7dffa8; --m-elevate:#b3a1ff; --m-external:#9aa3b5;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 20px 40px -24px rgba(0,0,0,.8);
  --key-bg:#1b1b22; --key-edge:#0a0a0d;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);padding:24px clamp(16px,3vw,40px) 48px}
a{color:inherit}
.lbl{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
header{display:flex;flex-wrap:wrap;align-items:end;gap:12px 28px;margin-bottom:22px}
header h1{font:700 40px/1 var(--f-num);letter-spacing:.01em;margin:0;text-transform:uppercase}
header nav{margin-left:auto;display:flex;gap:16px;font:500 12px var(--f-mono);color:var(--ink-2)}
.filters{display:flex;gap:6px}
.filters button{font:500 12px var(--f-mono);color:var(--ink-2);background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-2);background:var(--s3)}
.list{display:grid;gap:14px;max-width:1100px}
.g{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px clamp(14px,2.5vw,24px);display:grid;gap:14px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.gh h2{font:700 24px/1.1 var(--f-num);letter-spacing:.01em;margin:0}
.kind{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:0 5px}
.strip{display:grid;grid-template-columns:repeat(var(--n),minmax(28px,1fr));gap:4px;max-width:520px}
.strip i{display:grid;place-items:center;height:26px;border-radius:6px;background:var(--s3);font:500 11px var(--f-mono);font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums}
.strip i.on{background:color-mix(in srgb,var(--m-build) calc(25% + var(--v) * 60%),var(--s3));color:var(--ink)}
.strip-l{display:grid;grid-template-columns:repeat(var(--n),minmax(28px,1fr));gap:4px;max-width:520px}
.strip-l span{font:500 10px var(--f-mono);color:var(--ink-3);text-align:center}
.weeks{display:grid;gap:10px}
.wk{display:grid;grid-template-columns:64px 1fr;gap:12px}
@media (max-width:560px){.wk{grid-template-columns:1fr;gap:4px}}
.wk ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wk a{text-decoration:none;display:block;border-radius:10px;padding:6px 10px;margin:-6px -10px}
.wk a:hover{background:var(--s2)}
.wk b{font-weight:500}
.wk small{display:block;color:var(--ink-2);font-size:13px;max-width:80ch}
.wk .n{font:500 11px var(--f-mono);color:var(--ink-3);margin-left:6px}
.wk .ok{color:var(--m-build);margin-left:6px}
.empty{color:var(--ink-2);padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>Groups</h1>
  <div class="filters" role="group" aria-label="Kind of group">
    <button data-f="all" aria-pressed="true">All</button><button data-f="linear" aria-pressed="false">Linear projects</button><button data-f="topic" aria-pressed="false">Topics</button>
  </div>
  <nav><a href="/review">← review</a><a href="/">impact</a></nav>
</header>
<main class="list" id="list"><div class="empty">Loading groups…</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data = {weeks:[], groups:[]}, filter = "all";
function render(){
  const gs = data.groups.filter(g => filter === "all" || g.kind === filter)
    .map(g => ({...g, total: Object.values(g.weeks).reduce((a, ts) => a + ts.length, 0)}))
    .sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  const max = Math.max(1, ...gs.flatMap(g => Object.values(g.weeks).map(ts => ts.length)));
  const n = data.weeks.length;
  $("#list").innerHTML = gs.map(g => `<section class="g" aria-label="${esc(g.name)}">
    <div class="gh"><h2>${esc(g.name)}</h2><span class="kind">${g.kind === "topic" ? "topic" : "linear"}</span>
      <span class="lbl">${g.total} thread${g.total === 1 ? "" : "s"} · ${Object.keys(g.weeks).length} of ${n} weeks</span></div>
    <div style="display:grid;gap:3px"><div class="strip" style="--n:${n}">${data.weeks.map(w => { const c = (g.weeks[w] ?? []).length;
      return `<i class="${c ? "on" : ""}" style="--v:${c / max}" title="${w}: ${c}">${c || ""}</i>`; }).join("")}</div>
      <div class="strip-l" style="--n:${n}">${data.weeks.map(w => `<span>${w.slice(5)}</span>`).join("")}</div></div>
    <div class="weeks">${data.weeks.filter(w => g.weeks[w]).map(w => `<div class="wk"><span class="lbl">${w.slice(5)}</span><ul>
      ${g.weeks[w].map(t => `<li><a href="/review?week=${w}&key=${encodeURIComponent(t.key)}"><b>${esc(t.title ?? "Untitled")}</b><span class="n">${t.events}</span>${t.decided ? `<span class="ok" title="You decided this">✓</span>` : ""}
        ${t.summary ? `<small>${esc(t.summary)}</small>` : ""}</a></li>`).join("")}</ul></div>`).join("")
      || `<span class="lbl">No threads yet. Pick this group for a thread in review with P.</span>`}</div></section>`).join("")
    || `<div class="empty">No groups yet. In review, press P on a thread to put it in a group or create one.</div>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-f]"); if(!b) return;
  filter = b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
fetch("/api/groups").then(r => r.json()).then(d => { data = d; render(); });
</script>
</body>
</html>
